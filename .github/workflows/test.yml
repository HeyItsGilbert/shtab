name: ci
on:
  push:
  pull_request:
  schedule: [{cron: '0 9 * * 1'}]  # M H d m w (Mondays at 9:00)
  workflow_dispatch:
jobs:
  test:
    if: github.event_name != 'pull_request' || !contains('OWNER,MEMBER,COLLABORATOR', github.event.pull_request.author_association)
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.9, 3.14]
    steps:
    - uses: actions/checkout@v7
      with: {fetch-depth: 0}
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - run: pip install -U -e .[dev]
    - run: pytest
    - uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
  deploy:
    needs: test
    environment: pypi
    permissions: {contents: write, id-token: write}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.GH_TOKEN || github.token }}
    - uses: actions/setup-python@v7
      with: {python-version: '3.x'}
    - id: dist
      uses: casperdcl/deploy-pypi@v3
      with:
        build: true
        requirements: 'build twine packaging>=24.2' # https://github.com/pypa/twine/issues/1216
        upload: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags') }}
    - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
      name: gh release create --draft
      run: |
        changelog=$(git log --pretty='format:%d%n- %s%n%b---' $(git tag --sort=v:refname | tail -n2 | head -n1)..HEAD)
        tag="${GITHUB_REF#refs/tags/}"
        gh release create --title "shtab $tag stable" --draft --notes "$changelog" "$tag" dist/${{ steps.dist.outputs.whl }} dist/${{ steps.dist.outputs.targz }}
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
    - name: build docs
      run: |
        pushd docs
        pip install -U -r requirements.txt
        PYTHONPATH=. pydoc-markdown --build --site-dir=../../../dist/site
        popd
    - if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags') || github.event_name == 'workflow_dispatch' }}
      uses: casperdcl/push-dir@v1
      with:
        message: update static site
        branch: gh-pages
        history: false
        dir: dist/site
        nojekyll: true
        name: tqdm[bot]
        email: 68520887+tqdm-bot@users.noreply.github.com
